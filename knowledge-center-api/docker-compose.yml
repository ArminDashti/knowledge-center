name: knowledge-center
services:
  postgres:
    image: ${IMAGE_TAG:-knowledge-center-postgres:16}
    container_name: knowledge-center-postgres
    environment:
      POSTGRES_USER: kc
      POSTGRES_PASSWORD: kc
      POSTGRES_DB: knowledge_center
    ports:
      - "${PUBLISH_PORT:-5434}:${INTERNAL_PORT:-5432}"
    volumes:
      - knowledge_center_pgdata:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kc -d knowledge_center"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  knowledge_center_pgdata:

networks:
  app_net:
    external: true
    name: ${DOCKER_NETWORK:-knowledge-center-net}
