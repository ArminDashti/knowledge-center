root = "."
tmp_dir = "tmp"

[build]
  bin = "tmp\\main.exe"
  cmd = "go build -o ./tmp/main.exe ./cmd/server"
  delay = 800
  exclude_dir = ["tmp", "vendor", "testdata", ".git"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[misc]
  clean_on_exit = true
